# 与 compose.monolith.yml 合并；数据库、缓存、队列和记忆服务均只开放到容器私网。
# 常驻中间件：mysql、redis、kafka、mem0、qdrant。旧 Chroma 卷只作恢复来源，不挂到新运行时。
# kafka-storage-init、kafka-init 是一次性初始化容器，成功后退出属于正常状态。
# Dockerfile 构建镜像，Compose 创建并连接容器；说明见 docs/docker-monolith-deployment.md。
services:
  backend:
    build:
      args:
        UBUNTU_MIRROR: http://mirrors.cloud.aliyuncs.com/ubuntu
        MAVEN_MIRROR_URL: https://maven.aliyun.com/repository/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mem0:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  nginx:
    build:
      args:
        NPM_REGISTRY: ${DOORHANDLE_BUILD_NPM_REGISTRY:-https://registry.npmmirror.com}

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-doorhandledb}
      MYSQL_USER: ${MYSQL_USER:-doorhandle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    volumes:
      - doorhandle-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    mem_limit: 2g
    networks: [doorhandle-network]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - doorhandle-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [doorhandle-network]
    restart: unless-stopped

  kafka-storage-init:
    image: apache/kafka:4.2.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - doorhandle-kafka:/tmp/kraft-combined-logs
    networks: [doorhandle-network]
    restart: "no"

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: MzQ2YmVhMDMtOWJjOC00Nj
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - doorhandle-kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    mem_limit: 2g
    networks: [doorhandle-network]
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in detection.task.created detection.task.finished detection.task.progress detection.report.lifecycle.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    networks: [doorhandle-network]
    restart: "no"

  qdrant-storage-init:
    image: ${QDRANT_IMAGE:?Set immutable Qdrant engine image ID from the admitted pipeline receipt}
    pull_policy: never
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /data"]
    volumes:
      - doorhandle-qdrant:/data
    network_mode: none
    restart: "no"

  qdrant:
    # 固定 Linux/amd64 v1.20.0；与 Java/Python SDK 1.20.0 一起验证。
    image: ${QDRANT_IMAGE:?Set immutable Qdrant engine image ID from the admitted pipeline receipt}
    pull_policy: never
    user: "10001:10001"
    command: ["./entrypoint.sh", "--config-path", "/run/doorhandle-vector/server.json"]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT_INIT_FILE_PATH: /data/storage/.qdrant-initialized
    volumes:
      - doorhandle-qdrant:/data
      - type: bind
        source: ${QDRANT_PRIVATE_DIR:?Set ECS private Qdrant config directory}
        target: /run/doorhandle-vector
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      qdrant-storage-init:
        condition: service_completed_successfully
    healthcheck:
      # 官方镜像无 curl/wget；只探测无需密钥的就绪端点。
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r response <&3; [[ $$response == HTTP/*' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [doorhandle-network]
    restart: unless-stopped

  mem0:
    image: doorhandlecatch/mem0:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/mem0/Dockerfile
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
    # 仅注入记忆服务所需凭据。
    environment:
      MEM0_BRIDGE_TOKEN: ${MEM0_BRIDGE_TOKEN:?Set MEM0_BRIDGE_TOKEN}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-}
      MEM0_MODEL_GATEWAY_BASE_URL: ${MEM0_MODEL_GATEWAY_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY}
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-siliconflow-bge-m3-v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REQUESTS_PER_MINUTE: ${EMBEDDING_REQUESTS_PER_MINUTE:-60}
      EMBEDDING_MAX_INPUT_BYTES: ${EMBEDDING_MAX_INPUT_BYTES:-8000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      MEM0_PROVIDER_TIMEOUT_SECONDS: ${MEM0_PROVIDER_TIMEOUT_SECONDS:-15}
      MEM0_EXTRACTION_TIMEOUT_SECONDS: ${MEM0_EXTRACTION_TIMEOUT_SECONDS:-30}
      MEM0_WRITE_RESPONSE_SECONDS: ${MEM0_WRITE_RESPONSE_SECONDS:-3}
      MEM0_WRITE_REVIEW_SECONDS: ${MEM0_WRITE_REVIEW_SECONDS:-120}
      MEM0_LIFECYCLE_CLEANUP_ENABLED: ${MEM0_LIFECYCLE_CLEANUP_ENABLED:-true}
      MEM0_CLEANUP_INTERVAL_SECONDS: ${MEM0_CLEANUP_INTERVAL_SECONDS:-60}
      MEM0_DUPLICATE_REVIEW_ENABLED: ${MEM0_DUPLICATE_REVIEW_ENABLED:-true}
      MEM0_DUPLICATE_REVIEW_TIMEOUT_SECONDS: ${MEM0_DUPLICATE_REVIEW_TIMEOUT_SECONDS:-30}
      MEM0_VECTOR_BACKEND: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY_FILE: /run/doorhandle-vector/api-key
      MEM0_QDRANT_COLLECTION: ${MEM0_QDRANT_COLLECTION:-doorhandle_memories_bge_m3_v1}
      MEM0_STORAGE_GENERATION: ${MEM0_STORAGE_GENERATION:-qdrant-bge-m3-v1}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      LANGFUSE_PUBLIC_KEY_FILE: /run/observability-secrets/langfuse-public-key
      LANGFUSE_SECRET_KEY_FILE: /run/observability-secrets/langfuse-secret-key
      TELEMETRY_ID_HMAC_KEY_FILE: /run/observability-secrets/identity-hmac-key
      TELEMETRY_TRACE_SAMPLE_RATIO: ${TELEMETRY_TRACE_SAMPLE_RATIO:-0.1}
      TELEMETRY_METRICS_ENABLED: ${TELEMETRY_METRICS_ENABLED:-false}
      TELEMETRY_METRICS_HOST: 0.0.0.0
      TELEMETRY_METRICS_PORT: "9465"
      TELEMETRY_METRICS_TOKEN_FILE: /run/observability-secrets/metrics-token
    volumes:
      - doorhandle-mem0-qdrant:/data
      - type: bind
        source: ${QDRANT_PRIVATE_DIR:?Set ECS private Qdrant config directory}
        target: /run/doorhandle-vector
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OBSERVABILITY_SECRETS_DIR:?Set ECS private observability directory (may be empty when disabled)}
        target: /run/observability-secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      qdrant:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 2g
    networks: [doorhandle-network]
    restart: unless-stopped

volumes:
  doorhandle-mysql:
  doorhandle-redis:
  doorhandle-kafka:
  # 保留旧卷声明，不挂载、不删除、不转换。
  doorhandle-chroma:
  doorhandle-qdrant:
  doorhandle-mem0:
  doorhandle-mem0-qdrant:
