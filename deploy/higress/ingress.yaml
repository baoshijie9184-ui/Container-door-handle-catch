apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doorhandle
  namespace: higress-system
  creationTimestamp: "2000-01-01T00:00:00Z"
  resourceVersion: "1"
  annotations:
    higress.io/destination: doorhandle-web.dns:80
    higress.io/ignore-path-case: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
