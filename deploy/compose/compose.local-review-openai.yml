# Add to the isolated local review stack when using the fixed TLS relay.
services:
  backend:
    environment:
      OPENAI_API_KEY: ${REVIEW_OPENAI_API_KEY:?Load the OpenAI credential from the private provider file}
      AGENT_RESPONSES_BASE_URL: "https://api.openai.com/v1"
      AGENT_MODEL_PROXY_URL: "http://${REVIEW_BRIDGE_GATEWAY:?Set the review bridge gateway}:${REVIEW_OPENAI_RELAY_PORT:-17898}"
